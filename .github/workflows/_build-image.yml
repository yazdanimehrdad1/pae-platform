# Reusable: build one production image from its service directory, smoke-test it, and (only when
# asked, on main) push it to GHCR as ghcr.io/<owner>/pae-<service>:<git sha>. One release = one
# git SHA for every service. Called by ci.yml.
name: build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        description: Build context, the service's own directory
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      push:
        description: Push to GHCR after the smoke test
        required: true
        type: boolean

# No permissions block here on purpose: the caller sets them (contents: read for a pull request's
# build-only run, plus packages: write for the push on main). A block here would cap them.

jobs:
  image:
    name: ${{ inputs.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/pae-${SERVICE}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ inputs.service }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:smoke
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Smoke test
        run: sh scripts/ci/smoke_image.sh "$SERVICE" "$IMAGE:smoke"
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ steps.name.outputs.image }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (same layers, from the build cache)
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=pae-${{ inputs.service }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Summary
        if: inputs.push
        run: echo "Pushed \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
