# Reusable: build one production image from its service directory, smoke-test it, and (only when
# asked, on main) push it to Artifact Registry as
# us-central1-docker.pkg.dev/pae-platform-prod/pae/pae-<service>:<git sha>. One release = one git SHA
# for every service. Called by ci.yml. The push authenticates through Workload Identity Federation
# (repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_CI_SERVICE_ACCOUNT, printed by
# deploy/infra/gcp/bootstrap.sh); no key or secret is stored in GitHub.
name: build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        description: Build context, the service's own directory
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      push:
        description: Push to Artifact Registry after the smoke test
        required: true
        type: boolean

# No permissions block here on purpose: the caller sets them (contents: read for a pull request's
# build-only run, plus id-token: write for the WIF login on main). A block here would cap them.

jobs:
  image:
    name: ${{ inputs.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/pae-${SERVICE}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: us-central1-docker.pkg.dev/pae-platform-prod/pae
          SERVICE: ${{ inputs.service }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (loaded locally for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:smoke
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Smoke test
        run: sh scripts/ci/smoke_image.sh "$SERVICE" "$IMAGE:smoke"
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ steps.name.outputs.image }}

      - name: Authenticate to GCP (Workload Identity Federation)
        if: inputs.push
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Push (same layers, from the build cache)
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=pae-${{ inputs.service }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Summary
        if: inputs.push
        run: echo "Pushed \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
