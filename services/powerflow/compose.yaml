# powerflow — standalone: `make -C services/powerflow up`.
# Also included by the monorepo dev stack (deploy/compose/dev.yaml), so it follows the service
# convention:
#   - service and volume names are prefixed `powerflow-` (unique once every service's compose
#     file is included into one project);
#   - no container_name and no external networks;
#   - host ports are overridable: POWERFLOW_HTTP_PORT / POWERFLOW_POSTGRES_PORT /
#     POWERFLOW_MODBUS_PORT (1502 on the host: mock-modbus owns 502 in the dev stack);
#   - container-network values (hostnames, internal ports) are set in `environment:`, which
#     overrides anything the optional .env supplies for host-side runs.
name: powerflow

services:
  powerflow-postgres:
    image: postgres:16-alpine
    ports:
      - "${POWERFLOW_POSTGRES_PORT:-5436}:5432"
    environment:
      - POSTGRES_DB=powerflow
      - POSTGRES_USER=powerflow
      - POSTGRES_PASSWORD=${POWERFLOW_POSTGRES_PASSWORD:-powerflow}
    # Sites, Modbus maps and the active site. `make down-all` deletes it (back to the defaults).
    volumes:
      - powerflow-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerflow -d powerflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  powerflow:
    image: powerflow:dev
    build: .
    ports:
      - "${POWERFLOW_HTTP_PORT:-8020}:8000"
      # Modbus TCP (when the active site enables interfaces.modbus).
      - "${POWERFLOW_MODBUS_PORT:-1502}:502"
    # Service settings; optional. See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://powerflow:${POWERFLOW_POSTGRES_PASSWORD:-powerflow}@powerflow-postgres:5432/powerflow
      # Container values for settings a host-oriented .env could also set (it's loaded above):
      # the Modbus server always listens on 502 inside (published as POWERFLOW_MODBUS_PORT),
      # the CSV folders are the image's, and ACTIVE_SITE is never inherited.
      - MODBUS_HOST=0.0.0.0
      - MODBUS_PORT=502
      - PROFILES_DIR=profiles
      - POINT_STANDARD_DIR=docs/point-standard
      - ACTIVE_SITE=
    # Profile scenario CSVs. Docker seeds the volume from the image's profiles/ on first use;
    # `make down-all` deletes it (back to the shipped CSVs).
    volumes:
      - powerflow-profiles:/app/profiles
    depends_on:
      powerflow-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  powerflow-postgres-data:
  powerflow-profiles:
