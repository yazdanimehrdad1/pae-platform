# intelli-gateway — standalone: `make -C services/intelli-gateway up`.
# Also included by the monorepo dev stack (deploy/compose/dev.yaml). Service convention:
# service/volume names prefixed with the service dir, no container_name, no custom or external
# networks, host ports overridable, container-network values in `environment:`.
name: intelli-gateway

services:
  intelli-gateway-postgres:
    image: postgres:16.15-alpine
    ports:
      - "${INTELLI_GATEWAY_POSTGRES_PORT:-5437}:5432"
    environment:
      - POSTGRES_DB=intelli_gateway
      - POSTGRES_USER=intelli_gateway
      - POSTGRES_PASSWORD=${INTELLI_GATEWAY_POSTGRES_PASSWORD:-intelli_gateway}
    # PV forecast history and fetch log. `make down-all` deletes it.
    volumes:
      - intelli-gateway-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli_gateway -d intelli_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  intelli-gateway:
    image: intelli-gateway:dev
    build: .
    ports:
      - "${INTELLI_GATEWAY_HTTP_PORT:-8030}:8000"
    # Service settings; optional. See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Containers read real sites from backend-ot (host `make run` and tests use the fake ones).
      - USE_FAKE_DATA=${INTELLI_GATEWAY_USE_FAKE_DATA:-false}
      - BACKEND_OT_URL=http://backend-ot:8000
      - DATABASE_URL=postgresql+asyncpg://intelli_gateway:${INTELLI_GATEWAY_POSTGRES_PASSWORD:-intelli_gateway}@intelli-gateway-postgres:5432/intelli_gateway
    depends_on:
      intelli-gateway-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  intelli-gateway-postgres-data:
