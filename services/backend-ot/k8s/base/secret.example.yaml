# TEMPLATE ONLY — do NOT commit real values and do NOT add this file to
# kustomization.yaml `resources`. The real Secret is created out-of-band from GCP
# Secret Manager (see scripts/gcp_bootstrap.sh) so credentials never live in git.
#
# Create it manually for a bootstrap deploy:
#   kubectl -n <namespace> create secret generic pae-backend-ot-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(gcloud secrets versions access latest --secret=pae-backend-ot-postgres-password)" \
#     --from-literal=REDIS_PASSWORD="$(gcloud secrets versions access latest --secret=pae-backend-ot-redis-password)"
#
# The Deployment and migration Job consume it via `envFrom.secretRef`.
# Future: replace with an ExternalSecret (External Secrets Operator) that syncs
# from Secret Manager, so the Secret is declarative and GitOps-managed.
apiVersion: v1
kind: Secret
metadata:
  name: pae-backend-ot-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  # Only needed if Memorystore AUTH is enabled; otherwise omit.
  REDIS_PASSWORD: ""
