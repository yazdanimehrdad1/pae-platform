# In-cluster Redis (cache + scheduler leader-election/job locks).
# Replaces Memorystore for this dev/learning setup so the whole stack can scale to
# zero (no always-on managed Redis to pay for). Ephemeral on purpose — the cache is
# rebuildable and the scheduler simply re-elects a leader after a restart.
# Distinct `app: pae-backend-ot-redis` label keeps the redis Service from matching app pods
# (the base labels transformer stamps app.kubernetes.io/name on everything).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pae-backend-ot-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pae-backend-ot-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # No persistence: cache/locks only.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: pae-backend-ot-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
