# Throwaway stack for integration tests. Run it via `make test-integration`, never by hand
# against the dev stack: postgres and redis here live in tmpfs, publish no host ports, and
# are destroyed after every run, so tests can truncate/flush freely.
#
# The Makefile passes a per-worktree project name (-p backend-ot-test-<worktree>), so
# parallel agent worktrees each get their own isolated stack.

services:
  postgres-test:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_DB=pae_backend_ot_test
      - POSTGRES_USER=pae_backend_ot_test_user
      - POSTGRES_PASSWORD=pae_backend_ot_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pae_backend_ot_test_user -d pae_backend_ot_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    # Same Python as the app image; uv installs exactly what uv.lock pins (incl. dev group).
    image: ghcr.io/astral-sh/uv:0.11.15-python3.11-trixie-slim
    # Mirrors the monorepo layout, so code that reads the shared contracts/ (the dev seeder reads
    # mock-modbus's register map) finds it exactly as on the host. contracts/ is read-only.
    working_dir: /repo/services/backend-ot
    volumes:
      - .:/repo/services/backend-ot
      - ../../contracts:/repo/contracts:ro
      - uv-cache:/root/.cache/uv
    environment:
      # Venv lives outside the bind mount so the host's .venv is never overwritten.
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - UV_LINK_MODE=copy
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=pae_backend_ot_test
      - POSTGRES_USER=pae_backend_ot_test_user
      - POSTGRES_PASSWORD=pae_backend_ot_test_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - SCHEDULER_ENABLED=false
      # tests/integration/conftest.py refuses to truncate/flush unless this is set.
      - INTEGRATION_DB_RESET_ALLOWED=1
      - PYTEST_TARGET=${PYTEST_TARGET:-tests/integration}
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command:
      - bash
      - -c
      - >-
        uv sync --frozen --quiet &&
        uv run --frozen python scripts/migrate_db.py &&
        uv run --frozen pytest $$PYTEST_TARGET -v --color=yes -rfE

volumes:
  # External so `compose down` never removes it; `make test-integration` creates it if missing.
  uv-cache:
    name: backend-ot-uv-cache
    external: true
