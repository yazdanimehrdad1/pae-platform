[project]
name = "pae-backend-ot"
version = "1.0.0"
description = "PAE OT backend — Modbus TCP polling and time-series storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    # Explicit floor: we use status.HTTP_422_UNPROCESSABLE_CONTENT (added in Starlette 0.48),
    # and no FastAPI release requires Starlette that new.
    "starlette>=0.48.0",
    "uvicorn[standard]>=0.24.0",
    "pymodbus>=3.6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",  # Redis client for caching
    "hiredis>=2.2.0",  # C extension for faster Redis parsing (optional but recommended)
    "apscheduler>=3.10.0",  # Scheduler for cron jobs
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "sqlalchemy[asyncio]>=2.0.0",  # SQLAlchemy 2.0+ with async support
    "httpx>=0.25.0",  # HTTP client for cross-service communication
    # TODO: Add when implementing migrations
    # "alembic>=1.13.0",
    # TODO: Add when implementing metrics
    # "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",  # For testing FastAPI
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports allowed in __init__.py

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

