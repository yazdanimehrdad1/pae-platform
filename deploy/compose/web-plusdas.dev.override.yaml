# Wiring for web-plusdas inside the monorepo dev stack: nginx forwards /api/* to the
# backend-ot service, /powerflow-api/* to the powerflow service and /intelli-gateway-api/* to the
# intelli-gateway service on the shared compose network instead of the host ports, so the UI on
# http://localhost:5173 calls all three on its own origin.
services:
  web-plusdas:
    environment:
      - API_UPSTREAM=http://backend-ot:8000
      - POWERFLOW_UPSTREAM=http://powerflow:8000
      - INTELLI_GATEWAY_UPSTREAM=http://intelli-gateway:8000
    depends_on:
      # nginx resolves the upstream hostnames when it starts.
      - backend-ot
      - powerflow
      - intelli-gateway
