# Wiring for web-plusdas inside the monorepo dev stack: nginx forwards /api/* to the
# backend-ot service and /powerflow-api/* to the powerflow service on the shared compose
# network instead of the host ports, so the UI on http://localhost:5173 calls both on its own
# origin.
services:
  web-plusdas:
    environment:
      - API_UPSTREAM=http://backend-ot:8000
      - POWERFLOW_UPSTREAM=http://powerflow:8000
    depends_on:
      # nginx resolves the upstream hostnames when it starts.
      - backend-ot
      - powerflow
