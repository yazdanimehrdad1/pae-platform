# Google Cloud Ops Agent configuration for a PAE cloud VM (installed by host-setup.sh).
# Host metrics (CPU, memory, disk, network) are collected by default; this adds every container's
# log (Docker's json-file logs) to Cloud Logging as the `pae-containers` log.
logging:
  receivers:
    pae_containers:
      type: files
      include_paths:
        - /var/lib/docker/containers/*/*-json.log
      record_log_file_path: true
  processors:
    docker_json:
      type: parse_json
      time_key: time
      time_format: "%Y-%m-%dT%H:%M:%S.%L%z"
  service:
    pipelines:
      pae_containers:
        receivers: [pae_containers]
        processors: [docker_json]
